<!doctype html>
<meta charset="utf-8">
<title>wassname-ml-bench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Static page. bench.py writes results.json and _table.html; nothing here runs at publish time.
     The chart is hand-drawn SVG so the marker can be a lab logo, which no chart library does. -->
<style>
  :root { --ink: #1f2937; --grey: #9ca3af; --rule: #e5e7eb; }
  body { margin: 0 auto; padding: 2rem 1rem 4rem; max-width: 1000px; color: var(--ink);
         font: 16px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 1.6rem; margin: 0 0 .3rem; }
  p.lede { color: #4b5563; margin: 0 0 1.5rem; max-width: 62ch; }
  .controls { display: flex; gap: 1rem; align-items: baseline; margin: 0 0 .5rem; font-size: .9rem; }
  select { font: inherit; font-size: .9rem; padding: .15rem .3rem; }
  svg { display: block; width: 100%; height: auto; }
  .axis line, .axis path { stroke: var(--ink); }
  .axis text { font-size: 11px; fill: #4b5563; }
  .ring { fill: #fff; stroke: var(--grey); stroke-width: 2; }
  .label { font-size: 11px; fill: var(--ink); }
  .frontier { fill: none; stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 3 3; }
  .ref { stroke: var(--grey); stroke-width: 1; stroke-dasharray: 5 4; }
  .ref-text { font-size: 11px; fill: #6b7280; }
  #tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid var(--rule);
         border-radius: 4px; padding: .4rem .6rem; font-size: .85rem; box-shadow: 0 2px 8px #0002;
         opacity: 0; transition: opacity .1s; }
  /* results.md, rendered. The table is the reason this page exists, so it gets the typography:
     numbers align on the decimal, the model name stays put while the 12 item columns scroll. */
  #table { margin-top: 2.5rem; }
  #table h2 { font-size: 1.15rem; margin: 2rem 0 .4rem; }
  #table h3 { font-size: 1rem; margin: 1.6rem 0 .4rem; }
  #table p { max-width: 68ch; }
  #table sub { color: #6b7280; display: block; max-width: 68ch; line-height: 1.5; }
  #table table { border-collapse: collapse; width: 100%; font-size: .85rem;
                 font-variant-numeric: tabular-nums; display: block; overflow-x: auto; }
  #table th, #table td { padding: .35rem .5rem; text-align: right; white-space: nowrap;
                         border-bottom: 1px solid var(--rule); }
  #table th { font-weight: 600; border-bottom: 2px solid var(--ink); }
  #table th:first-child, #table td:first-child { text-align: left; position: sticky; left: 0;
                                                 background: #fff; }
  #table tbody tr:hover td { background: #f9fafb; }
  #table td:nth-child(2) { font-weight: 600; }
  footer { margin-top: 2rem; color: #6b7280; font-size: .85rem; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>

<!-- The prose lives in page.md and is wassname's to edit. Nothing here is hand-written text. -->
<div id="intro"></div>

<div class="controls">
  <label>cost as <select id="axis">
    <option value="$/run">dollars per run</option>
    <option value="ktok">thousands of tokens</option>
  </select></label>
  <label>lab <select id="lab"><option value="">all</option></select></label>
</div>
<svg id="chart" viewBox="0 0 1000 560" role="img" aria-label="score against cost"></svg>
<div id="tip"></div>
<div id="table"></div>
<footer id="version"></footer>

<script>
const SVG = "http://www.w3.org/2000/svg";
const PAD = { l: 60, r: 30, t: 20, b: 50 };
const W = 1000, H = 560;
const RING = 13, LOGO = 15;
const AXES = {
  "$/run": { title: "$ per run, all 12 items", fmt: v => "$" + fmt(v) },
  "ktok": { title: "thousands of tokens per run, reasoning included", fmt: fmt },
};

function fmt(v) { return v >= 1 ? String(+v.toFixed(2)) : String(+v.toPrecision(2)); }
function el(name, attrs, parent) {
  const n = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}

// Points that nothing else beats on both axes: less cost AND more score.
function frontier(rows, x) {
  const out = [];
  let best = -Infinity;
  for (const r of [...rows].sort((a, b) => a[x] - b[x] || b.score - a.score))
    if (r.score > best) { out.push(r); best = r.score; }
  return out;
}

function draw(data, x, lab) {
  const svg = document.getElementById("chart");
  svg.textContent = "";
  const rows = data.rows.filter(r => r[x]);
  const shown = lab ? rows.filter(r => r.company === lab) : rows;
  // Bounds come from every point, so filtering a lab moves nothing under it.
  const xs = rows.map(r => Math.log10(r[x]));
  const x0 = Math.min(...xs) - 0.25, x1 = Math.max(...xs) + 0.25;
  const y1 = Math.max(1.05, Math.max(...rows.map(r => r.score)) + 0.08);
  const y0 = Math.min(0, Math.min(...rows.map(r => r.score))) - 0.05;
  const px = v => PAD.l + (Math.log10(v) - x0) / (x1 - x0) * (W - PAD.l - PAD.r);
  const py = v => H - PAD.b - (v - y0) / (y1 - y0) * (H - PAD.t - PAD.b);

  const axis = el("g", { class: "axis" }, svg);
  el("line", { x1: PAD.l, y1: H - PAD.b, x2: W - PAD.r, y2: H - PAD.b }, axis);
  el("line", { x1: PAD.l, y1: PAD.t, x2: PAD.l, y2: H - PAD.b }, axis);
  // One tick per decade on x: the numbers that matter are the powers of ten.
  for (let d = Math.ceil(x0); d <= Math.floor(x1); d++) {
    const v = Math.pow(10, d);
    el("line", { x1: px(v), y1: H - PAD.b, x2: px(v), y2: H - PAD.b + 5 }, axis);
    Object.assign(el("text", { x: px(v), y: H - PAD.b + 18, "text-anchor": "middle" }, axis),
                  { textContent: AXES[x].fmt(v) });
  }
  for (let v = Math.ceil(y0 * 5) / 5; v <= y1; v += 0.2) {
    el("line", { x1: PAD.l - 5, y1: py(v), x2: PAD.l, y2: py(v) }, axis);
    Object.assign(el("text", { x: PAD.l - 9, y: py(v) + 4, "text-anchor": "end" }, axis),
                  { textContent: v.toFixed(1) });
  }
  Object.assign(el("text", { x: (W + PAD.l) / 2, y: H - 8, "text-anchor": "middle" }, axis),
                { textContent: AXES[x].title });
  Object.assign(el("text", { x: 14, y: (H - PAD.b + PAD.t) / 2, "text-anchor": "middle",
                             transform: `rotate(-90 14 ${(H - PAD.b + PAD.t) / 2})` }, axis),
                { textContent: "mean score" });

  el("line", { class: "ref", x1: PAD.l, y1: py(1), x2: W - PAD.r, y2: py(1) }, svg);
  Object.assign(el("text", { class: "ref-text", x: PAD.l + 4, y: py(1) - 5 }, svg),
                { textContent: "1.00 = wassname's own answer" });

  const front = frontier(shown, x);
  el("polyline", { class: "frontier",
                   points: front.map(r => `${px(r[x])},${py(r.score)}`).join(" ") }, svg);

  const tip = document.getElementById("tip");
  for (const r of shown) {
    const g = el("g", {}, svg);
    el("circle", { class: "ring", cx: px(r[x]), cy: py(r.score), r: RING }, g);
    el("image", { href: data.logos[r.company], x: px(r[x]) - LOGO / 2, y: py(r.score) - LOGO / 2,
                  width: LOGO, height: LOGO, preserveAspectRatio: "xMidYMid meet" }, g);
    Object.assign(el("text", { class: "label", x: px(r[x]), y: py(r.score) - RING - 6,
                               "text-anchor": "middle" }, g), { textContent: r.model });
    g.addEventListener("pointerenter", e => {
      tip.innerHTML = `<b>${r.model}</b><br>${r.company}<br>score ${r.score.toFixed(2)}` +
        `<br>$${fmt(r["$/run"])} per run<br>${r.ktok ? r.ktok + "k tokens" : "tokens unknown"}`;
      tip.style.opacity = 1;
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    });
    g.addEventListener("pointerleave", () => { tip.style.opacity = 0; });
  }
}

fetch("results.json").then(r => r.json()).then(data => {
  const labs = [...new Set(data.rows.map(r => r.company))].sort();
  const labSel = document.getElementById("lab");
  for (const c of labs) labSel.add(new Option(c, c));
  const axisSel = document.getElementById("axis");
  const redraw = () => draw(data, axisSel.value, labSel.value);
  axisSel.onchange = labSel.onchange = redraw;
  document.getElementById("version").textContent = data.version;
  redraw();
});
// Two markdown files: page.md is hand-written, results.md is what bench.py wrote for git, and the
// page renders the same table a reader would see on GitHub.
fetch("page.md").then(r => r.text()).then(md => {
  document.getElementById("intro").innerHTML = marked.parse(md);
});
fetch("results.md").then(r => r.text()).then(md => {
  document.getElementById("table").innerHTML = marked.parse(md);
  shade(document.querySelector("#table table"));
});

// The 12 item columns are 12 numbers a reader has to compare by eye. Tint each cell by its value
// and the column reads as a strip of small multiples: pale is where a model fell into the traps,
// dark is where it matched wassname. Same numbers, no extra ink.
function shade(table) {
  if (!table) return;
  const head = [...table.querySelectorAll("thead th")].map(th => th.textContent.trim());
  const cols = head.map((h, i) => /#\d+/.test(h) ? i : -1).filter(i => i >= 0);
  const rows = [...table.querySelectorAll("tbody tr")];
  const vals = rows.flatMap(tr => cols.map(i => parseFloat(tr.cells[i]?.textContent)))
                   .filter(v => !isNaN(v));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  for (const tr of rows) for (const i of cols) {
    const v = parseFloat(tr.cells[i]?.textContent);
    if (isNaN(v)) continue;
    tr.cells[i].style.background = `rgba(31,41,55,${(0.06 + 0.34 * (v - lo) / (hi - lo)).toFixed(3)})`;
  }
}
</script>
